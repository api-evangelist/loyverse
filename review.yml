sources:
  - url: https://developer.loyverse.com/docs/
    type: Documentation
    note: Loyverse API reference (single-page dashboard); base URL https://api.loyverse.com/v1.0, all REST. No WebSocket mentioned.
  - url: https://help.loyverse.com/help/loyverse-api
    type: Documentation
    note: How to create personal access tokens; token passed as Bearer, unlimited access to account resources.
  - url: https://support.loyverse.com/en/articles/8061203-faqs-about-loyverse-api
    type: Documentation
    note: API FAQ covering webhooks (three creation methods, X-Loyverse-Signature) and resource examples.
  - url: https://loyverse.com/loyverse-pos-api
    type: ProductPage
    note: POS API marketing page describing item/inventory/order/customer sync use cases.
  - url: https://github.com/matteobe/loyverse
    type: SourceCode
    note: Community open-source Python wrapper (not Loyverse's own code); REST client, no WebSocket.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Loyverse's own public API is
    request/response REST (https://api.loyverse.com/v1.0) plus outbound
    webhooks. No AsyncAPI document was created because there is no server-push
    or bidirectional streaming transport on Loyverse's own API to model; webhook
    callbacks are one-shot HTTP POSTs to a consumer endpoint.
