aid: loyverse
name: Loyverse
review:
  question: Does Loyverse expose a documented public WebSocket API?
  answer: false
  date: '2026-07-11'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Loyverse's public integration surface is
    a request/response REST API (base https://api.loyverse.com/v1.0) plus
    outbound webhooks. Webhooks are server-to-endpoint HTTP callbacks (Loyverse
    POSTs events such as receipts and inventory changes to a URL you register),
    not a persistent client connection. There is no server-push WebSocket or SSE
    transport on Loyverse's own API to model, so no AsyncAPI document was created.
findings:
  summary: |
    Loyverse does not publish a documented public WebSocket API. Loyverse is a
    free point of sale (POS) platform, and its developer API is a REST API over
    HTTPS at https://api.loyverse.com/v1.0. Authentication is by personal access
    token (Bearer) or OAuth 2.0 authorization-code flow with scoped permissions.
    Every documented resource - items, categories, receipts, customers,
    inventory, stores, employees, payment types, taxes, discounts, modifiers,
    suppliers, POS devices, and shifts - is exposed as request/response REST with
    cursor-based pagination. Near-real-time notifications are delivered via
    outbound webhooks (Loyverse POSTs events to a URL you register; webhooks
    created through an OAuth app carry an X-Loyverse-Signature header). No
    realtime, bidirectional, or streaming WebSocket (ws:// or wss://) endpoint is
    documented anywhere in Loyverse's API reference as of the review date.
  openSource: |
    Loyverse's platform and API are not open source. The POS, Dashboard, Kitchen
    Display, and Customer Display apps are free (proprietary), with paid per-store
    add-ons. Several third-party open-source client wrappers exist
    (for example matteobe/loyverse, siarheipashkevich/loyverse-sdk) but these
    are community libraries, not Loyverse's own code.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.loyverse.com/v1.0
      documented: true
      note: Full CRUD REST API for all POS resources with cursor-based pagination.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Outbound HTTP callbacks for events (e.g. receipts, inventory). Server-to-endpoint POST, not WebSocket. OAuth-created webhooks include X-Loyverse-Signature.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Loyverse's API reference or developer docs as of the review date.
