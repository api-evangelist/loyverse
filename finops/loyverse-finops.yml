description: >-
  FinOps view of Loyverse spend. Loyverse's core POS, Dashboard, Kitchen
  Display, Customer Display, and the REST API are free, so for many integrations
  there is no direct Loyverse invoice - the cost is the merchant's own
  development and hosting of any integration. Where spend does occur it is
  driven by optional per-store add-ons (Employee Management, Advanced Inventory,
  and Unlimited Sales History), each billed monthly or annually per store. Cost
  therefore scales with the number of stores and which add-ons each store
  enables, not with API call volume.
notes: >-
  The API has no metered per-call fee; the dominant Loyverse-billed cost is the
  count of stores times the enabled add-ons. Verify current per-store add-on
  rates on the Loyverse pricing page during reconciliation.
