principles:
- name: Visibility
  description: Track which stores have which paid add-ons enabled; the free API itself carries no metered charge.
- name: Allocation
  description: Map add-on subscriptions to the stores/locations and teams that use them so cost lands on the right cost center.
- name: Optimization
  description: Enable add-ons only on the stores that need them, use the 14-day trial to validate value, and pay annually (about two months free) where a store's need is ongoing.
- name: Accountability
  description: Review the store-by-add-on subscription list monthly against actual usage and disable add-ons on stores that no longer need them.
