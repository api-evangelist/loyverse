aid: loyverse
url: https://raw.githubusercontent.com/api-evangelist/loyverse/refs/heads/main/apis.yml
name: Loyverse
kind: company
description: >-
  Loyverse is a free point of sale (POS) platform for small and independent
  retail stores, cafes, bars, and restaurants, spanning the Loyverse POS app,
  Back Office dashboard, Kitchen Display, and Customer Display. The Loyverse API
  is a documented REST API at https://api.loyverse.com/v1.0 that exposes the same
  POS data - items and variants, categories, receipts (sales), customers and
  loyalty, inventory levels, stores, employees, payment types, taxes, discounts,
  modifiers, suppliers, POS devices, and shifts - so developers can build
  integrations for accounting, e-commerce order sync, inventory synchronization,
  loyalty and marketing, e-invoicing compliance, and custom reporting.
  Authentication is by personal access token (Bearer) or OAuth 2.0
  authorization-code flow with scoped permissions, and webhooks push events such
  as receipts and inventory changes to consumer endpoints.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: true
  try_now: true
  public: false
  label: Freemium (free trial) · Self-serve signup
